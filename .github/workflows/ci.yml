name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what pyproject promises; the ceiling is what contributors run.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml,kafka,api,xai]"

      - name: Lint
        run: ruff check src tests

      - name: Format
        run: ruff format --check src tests

      - name: Type check
        run: mypy

      - name: Test
        # No ARIS_SALT: the suite provides its own key, and the absence here
        # proves the code fails closed rather than falling back to a default.
        run: pytest

      - name: Demo runs end to end
        run: python -m aris.demo.anu_transfer
