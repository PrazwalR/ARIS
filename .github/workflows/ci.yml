name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what pyproject promises; the ceiling is what contributors run.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml,kafka,api,xai,hsm]"

      - name: Lint
        run: ruff check src tests

      - name: Format
        run: ruff format --check src tests

      - name: Type check
        run: mypy

      - name: Test
        # No ARIS_SALT: the suite provides its own key, and the absence here
        # proves the code fails closed rather than falling back to a default.
        run: pytest

      - name: Demo runs end to end
        run: python -m aris.demo.anu_transfer

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npx oxlint src e2e --deny-warnings

      - name: Unit and component tests
        run: npx vitest run

      - name: Build
        run: npx vite build

  frontend-e2e:
    # The real showcase server (python -m aris.demo.server) serving the
    # production build: every decision in these tests is a real BankBot call.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api]"
          cd frontend/app && npm ci && npx playwright install --with-deps chromium

      - name: End-to-end
        working-directory: frontend/app
        env:
          ARIS_PYTHON: python
        run: npx playwright test
