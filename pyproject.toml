[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aris"
dynamic = ["version"]
description = "AI-Agent Risk Integration System"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

# Runtime dependencies. Deliberately minimal: this is what the M0 core needs and
# nothing more. The heavy federated-learning and API stacks arrive with the
# milestones that actually use them, as extras below.
dependencies = [
    "pydantic>=2.7",      # schema validation on the shared contract
    "cryptography>=42.0", # Ed25519 publisher attestation
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
]
# M1 -- federated learning. Training uses a NumPy MLP, not torch.
ml = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "flwr>=1.9",
]
# M3 -- Kafka-backed risk bus. Pure-Python client (no librdkafka/C dependency);
# talks to Schema Registry over its plain REST API instead of confluent-kafka.
kafka = [
    "kafka-python>=2.0",
]
# M4 -- BankBot HTTP API.
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]
# M5 -- explainability + drift monitoring.
xai = [
    "shap>=0.45",
    "evidently>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
# Single source of truth: src/aris/__init__.py
version = { attr = "aris.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "UP", "ARG", "RET", "C4", "PIE", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Pytest fixtures are requested by name and are often used only for the
# environment they set up, and fakes must match the interface they stand in for
# whether or not they read every argument.
"tests/*" = ["ARG002", "ARG001"]

[tool.mypy]
# Higher than requires-python's 3.10 floor: numpy's bundled stubs use PEP 695
# `type` statements that only parse under 3.12+. This only affects how mypy
# reads stub syntax, not what runtime versions the code itself supports.
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["flwr.*", "sklearn.*", "pandas.*", "kafka.*", "shap.*", "evidently.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keeps `pytest` working from a bare checkout, without requiring `pip install -e .`.
# "." (not just "src") because tests/test_api_kafka.py does
# `from tests.test_kafka_bus import requires_kafka`, which needs the repo root
# importable as a package -- true for free under `python -m pytest` (which puts
# cwd on sys.path) but not under a bare `pytest` invocation, which is what CI runs.
pythonpath = ["src", "."]
addopts = "-q --strict-markers --strict-config"
