# Local dev Kafka for M3 -- the Shared Risk-Signal Bus over a real broker instead
# of the in-memory stand-in. KRaft mode: no separate Zookeeper container.
#
# Start:  docker compose up -d
# Stop:   docker compose down -v   (the -v also drops the topic/schema state)
#
# No SASL/mTLS/ACLs here on purpose -- this is a single-developer local broker,
# and layering auth onto a docker-compose demo buys nothing but complexity. A
# real deployment needs all three; see docs/SECURITY.md M3 section for the
# concrete kafka-acls.sh commands and the mTLS gap this leaves open.

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: aris-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: ARISkRaftClusterId001
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  # Karapace (Aiven, Apache-2.0): a Confluent-Schema-Registry-API-compatible
  # registry, used here instead of confluentinc/cp-schema-registry to avoid a
  # JVM in the stack -- the wire protocol this project's schema_registry.py
  # client speaks (POST /subjects/{s}/versions, Confluent wire-format framing)
  # is identical either way. Invocation is `python3 -m karapace`: the image's
  # installed `karapace` console-script is broken in this build (a genuine
  # packaging bug in the image, confirmed via `docker run --entrypoint sh`),
  # so the module form is used directly instead.
  schema-registry:
    image: ghcr.io/aiven-open/karapace:latest
    container_name: aris-schema-registry
    command: ["python3", "-m", "karapace"]
    platform: linux/amd64
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      KARAPACE_BOOTSTRAP_URI: kafka:19092
      KARAPACE_HOST: 0.0.0.0
      KARAPACE_PORT: 8081
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
