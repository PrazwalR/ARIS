# Local dev Kafka for M3 -- the Shared Risk-Signal Bus over a real broker instead
# of the in-memory stand-in. KRaft mode: no separate Zookeeper container.
#
# Start:  docker compose up -d
# Stop:   docker compose down -v   (the -v also drops the topic/schema state)
#
# Two listeners on the same broker, deliberately:
#   - PLAINTEXT_HOST (9092): open, no auth. What M0-M6's existing tests and
#     the demo use, so they need no certs to run.
#   - SSL_HOST (9093): mTLS + per-principal ACLs (docs/SECURITY.md SS3.8).
#     Run `python scripts/generate_dev_certs.py` first to generate ./certs/
#     (gitignored) and `scripts/setup_kafka_acls.sh` after the broker is up
#     to grant per-bank Write ACLs, then see tests/test_kafka_mtls.py for a
#     working client.
#
# The authorizer applies broker-wide, not per-listener, so PLAINTEXT_HOST
# staying fully open (`User:ANONYMOUS` is a super user) is a real, stated
# trade-off, not an oversight: a real deployment enabling this would close
# the plaintext listener entirely rather than keep it open for anonymous
# full access next to an ACL-enforced one.

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: aris-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - ./certs/broker:/etc/kafka/certs/broker:ro
      - ./certs/ca.pem:/etc/kafka/certs/ca.pem:ro
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092,SSL_HOST://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092,SSL_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,SSL_HOST:SSL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: ARISkRaftClusterId001
      # -- SSL_HOST listener: mTLS (docs/SECURITY.md SS3.8) --
      KAFKA_SSL_KEYSTORE_TYPE: PEM
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/certs/broker/keystore.pem
      KAFKA_SSL_TRUSTSTORE_TYPE: PEM
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/certs/ca.pem
      KAFKA_SSL_CLIENT_AUTH: required
      # A client cert's identity is its bare CN (e.g. "BANK-B"), not the full
      # RFC 2253 DN Kafka derives by default -- kafka-acls.sh grants and
      # aris.kafka_bus's bank_id both need to agree on that shorter form.
      KAFKA_SSL_PRINCIPAL_MAPPING_RULES: "RULE:^CN=([a-zA-Z0-9_-]+).*$$/$$1/,DEFAULT"
      # -- Per-principal ACLs (docs/SECURITY.md SS3.8) --
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      # ANONYMOUS (the principal PLAINTEXT_HOST connections get, having no
      # certificate to derive an identity from) is a super user so that
      # listener's existing free-access behavior is unchanged -- see the
      # trade-off note above. kafka-broker itself needs to be a super user
      # too, or the controller/inter-broker traffic this single node also
      # carries would be subject to ACLs it was never designed to satisfy.
      KAFKA_SUPER_USERS: "User:ANONYMOUS;User:kafka-broker"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  # Karapace (Aiven, Apache-2.0): a Confluent-Schema-Registry-API-compatible
  # registry, used here instead of confluentinc/cp-schema-registry to avoid a
  # JVM in the stack -- the wire protocol this project's schema_registry.py
  # client speaks (POST /subjects/{s}/versions, Confluent wire-format framing)
  # is identical either way. Invocation is `python3 -m karapace`: the image's
  # installed `karapace` console-script is broken in this build (a genuine
  # packaging bug in the image, confirmed via `docker run --entrypoint sh`),
  # so the module form is used directly instead.
  schema-registry:
    image: ghcr.io/aiven-open/karapace:latest
    container_name: aris-schema-registry
    command: ["python3", "-m", "karapace"]
    platform: linux/amd64
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      KARAPACE_BOOTSTRAP_URI: kafka:19092
      KARAPACE_HOST: 0.0.0.0
      KARAPACE_PORT: 8081
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
